<header class="site-header">
  <div class="container header-inner">
    <a href="{{ url_for('main.index') }}" class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 40 40" fill="none">
          <path d="M20 4C11.2 4 4 11.2 4 20s7.2 16 16 16 16-7.2 16-16S28.8 4 20 4Z" stroke="currentColor" stroke-width="2"/>
          <path d="M20 12v16M12 20h16" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="brand-name">{{ _('site_name') }}</span>
    </a>

    <button class="nav-toggle" id="navToggle" aria-label="menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <nav class="site-nav" id="siteNav">
      <a href="{{ url_for('main.index') }}">{{ _('nav_home') }}</a>
      <a href="{{ url_for('main.index') }}#departments">{{ _('nav_departments') }}</a>
      <a href="{{ url_for('booking.my_appointments') }}">{{ _('nav_my_appointments') }}</a>
      <a href="{{ url_for('booking.book') }}" class="btn btn-small btn-primary nav-cta">{{ _('nav_book') }}</a>
    </nav>

    <div class="header-tools">
      <a class="tool-btn lang-switch" href="{{ url_for('set_language', lang_code='en' if current_lang == 'ar' else 'ar') }}" title="{{ _('lang_toggle') }}">
        {{ _('lang_toggle') }}
      </a>
      <button class="tool-btn theme-switch" id="themeToggle" type="button" title="{{ _('theme_toggle') }}" aria-label="{{ _('theme_toggle') }}">
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v2.4M12 19.6V22M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2 12h2.4M19.6 12H22M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>
</header>
