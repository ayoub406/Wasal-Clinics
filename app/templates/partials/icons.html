{% macro icon(name, size=28) %}
{% if name == 'bone' %}
<svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none"><path d="M6.5 9.5c-1.1 0-2-.9-2-2a2 2 0 1 1 3.6-1.2l6.6 6.6a2 2 0 1 1-1.2 3.6c0 1.1-.9 2-2 2a2 2 0 0 1-2-2c0-.2 0-.4.1-.6l-3.6-3.6c-.2.1-.4.1-.6.1a2 2 0 0 1-2-2c0-.3.1-.6.2-.9Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
{% elif name == 'tooth' %}
<svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none"><path d="M12 4c-1.6 0-2.4.9-3.5.9C6.9 4.9 5 6 5 9.2c0 2.6.8 4 1.4 6 .5 1.7.7 3.8 2 3.8.9 0 1-1.6 1.2-3 .2-1.2.5-2.3 2.4-2.3s2.2 1.1 2.4 2.3c.2 1.4.3 3 1.2 3 1.3 0 1.5-2.1 2-3.8.6-2 1.4-3.4 1.4-6 0-3.2-1.9-4.3-3.5-4.3-1.1 0-1.9-.9-3.5-.9Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
{% elif name == 'pulse' %}
<svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none"><path d="M3 12h4l2-6 4 12 2-8 1.5 2H21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
{% elif name == 'leaf' %}
<svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none"><path d="M5 19c8 0 14-6 14-14-8 0-14 6-14 14Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M5 19c0-4 2-8 6-10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
{% elif name == 'baby' %}
<svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.6"/><path d="M6 20c0-3.5 2.7-6 6-6s6 2.5 6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M9.5 8h.01M14.5 8h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
{% elif name == 'heart' %}
<svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none"><path d="M12 20s-7.5-4.7-9.6-9.4C1.2 7.1 3 4 6.4 4c2 0 3.3 1 4.6 2.6C12.3 5 13.6 4 15.6 4 19 4 20.8 7.1 19.6 10.6 17.5 15.3 12 20 12 20Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
{% elif name == 'heartbeat' %}
<svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none"><path d="M20.5 12.5H17l-2 5-3-10-2 5H3.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 8.5c-.9-1.9.2-4 2.4-4 1.3 0 2.2.7 3 1.7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
{% elif name == 'eye' %}
<svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.6" stroke="currentColor" stroke-width="1.6"/></svg>
{% else %}
<svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none"><path d="M6 3v6a4 4 0 0 0 8 0V3M14 9v2a6 6 0 0 1-12 0M14 5h4a3 3 0 1 1-1.5 5.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
{% endif %}
{% endmacro %}
